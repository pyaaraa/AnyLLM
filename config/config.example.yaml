server:
  host: 127.0.0.1
  port: 3000
  logging: dev

auth:
  enabled: false

responses_store:
  type: in_memory

access_keys:
  - sk-anyllm-example-key-1
  - sk-anyllm-example-key-2

providers:
  openai:
    type: openai
    api_key: sk-openai-api-key
  anthropic:
    type: anthropic
    api_key: sk-anthropic-api-key
  google:
    type: google
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: sk-google-api-key
  fireworks:
    type: fireworks
    base_url: https://api.fireworks.ai/inference/v1
    api_key: sk-fireworks-api-key
  groq:
    type: openai
    base_url: https://api.groq.com/openai/v1
    api_key: sk-groq-api-key
  openrouter:
    type: openai
    responses: false
    base_url: https://openrouter.ai/api/v1
    api_key: sk-openrouter-api-key

models:
  openai/gpt-4o:
    providers:
      - provider: openai
        model: gpt-4o
  anthropic/claude-3-5-sonnet:
    providers:
      - provider: anthropic
        model: claude-3-5-sonnet-20241022
        max_tokens: 8192
  google/gemini-2.5-flash:
    providers:
      - provider: google
        model: gemini-2.5-flash
  meta-llama/llama-3.3-70b-instruct:
    providers:
      - provider: groq
        model: llama-3.3-70b-versatile
  "*":
    providers:
      - provider: openrouter
        model: ""
